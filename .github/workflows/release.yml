# Builds gesu for every platform when a version tag is pushed, and attaches
# the binaries to the release:  git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: Pack (Mac and Linux)
        if: runner.os != 'Windows'
        run: tar -czf gesu-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release gesu

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/gesu.exe -DestinationPath gesu-${{ matrix.target }}.zip

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Five jobs race to create the release; the losers only upload.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" gesu-${{ matrix.target }}.* --clobber

  extension:
    # The editor extension, for Cursor and VSCodium, which cannot use the
    # VS Code Marketplace.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pack
        working-directory: editors/vscode
        run: |
          npm install --no-audit --no-fund
          npx --yes @vscode/vsce package --allow-missing-repository --skip-license --out gesu-lang.vsix
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/gesu-lang.vsix --clobber
